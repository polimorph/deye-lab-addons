name: EMHASS Perfect World (lab)
version: "0.10.1"
slug: emhass_perfect_world
description: Același EMHASS ca producția, rulat pe PV și consum perfecte, pentru scoreboard.
url: https://github.com/polimorph/deye-lab-addons
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - share:rw
options:
  emhass_version: auto
  production_addon_slug: 5b918bf2_emhass
  capture_entity: sensor.deye_economic_auditor_scenario_capture
  data_dir: /share/deye_lab/pw_lab
  poll_seconds: 30
  backfill_days: 10
  chain_start: "2026-11-04T15:15:00+02:00"
  chain_every_seconds: 300
  log_level: info
schema:
  emhass_version: str
  production_addon_slug: str
  capture_entity: str
  data_dir: str
  poll_seconds: int(5,600)
  backfill_days: int(1,10)
  chain_start: str
  chain_every_seconds: int(60,3600)
  log_level: list(debug|info|warning|error)
